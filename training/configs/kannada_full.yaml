# Full-Dataset Kannada Handwriting Recognition Fine-Tuning Configuration
experiment_name: kannada_handwriting_full_gpu
languages:
  - kannada

output_dir: models/trocr/kannada_full_checkpoints
batch_size: 8
eval_batch_size: 8
num_epochs: 6
learning_rate: 0.00003
weight_decay: 0.01
warmup_steps: 200
logging_steps: 50
eval_steps: 1000
save_steps: 1000
save_total_limit: 3
mixed_precision: "fp16"
device: "cuda"
seed: 42

model:
  model_name_or_path: "microsoft/trocr-small-handwritten"
  tokenizer_name_or_path: "xlm-roberta-base"
  model_version: "kannada_full_v1"
  max_sequence_length: 32
  image_size: [384, 384]
  freeze_encoder: false

augmentation:
  enabled: true
  rotation_range_deg: 2.5
  contrast_range: [0.85, 1.15]
  brightness_range: [0.90, 1.10]
  noise_std: 0.015
  blur_kernel_prob: 0.08

dataset:
  train_manifest: "training/datasets/iiit_kannada_train.jsonl"
  val_manifest: "training/datasets/iiit_kannada_val.jsonl"
  test_manifest: "training/datasets/test_kannada.jsonl"
  max_train_samples: null
  max_val_samples: 1000
  validate_images: false
  ignore_missing: true
