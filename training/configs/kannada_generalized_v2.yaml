# V2 Generalized Character-Balanced Fine-Tuning Configuration
# Starting from V1 checkpoint, training on expanded 11K+ balanced dataset
experiment_name: kannada_generalized_v2_training
languages:
  - kannada

output_dir: models/trocr/kannada_generalized_v2_checkpoints
batch_size: 8
eval_batch_size: 8
num_epochs: 3
learning_rate: 0.000015
weight_decay: 0.01
warmup_steps: 60
logging_steps: 10
eval_steps: 150
save_steps: 150
save_total_limit: 2
mixed_precision: "fp16"
device: "cuda"
seed: 42

model:
  model_name_or_path: "models/trocr/kannada_generalized_checkpoints/best_checkpoint"
  tokenizer_name_or_path: "models/trocr/kannada_generalized_checkpoints/best_checkpoint"
  model_version: "kannada_generalized_v2"
  max_sequence_length: 32
  image_size: [384, 384]
  freeze_encoder: false

augmentation:
  enabled: true
  rotation_range_deg: 2.0
  contrast_range: [0.90, 1.10]
  brightness_range: [0.90, 1.10]
  noise_std: 0.012
  blur_kernel_prob: 0.06

dataset:
  train_manifest: "training/datasets/kannada_character_balanced_v2/train_v2.jsonl"
  val_manifest: "training/datasets/kannada_character_balanced_v2/validation_v2.jsonl"
  test_manifest: "training/datasets/kannada_diagnostic_val/diagnostic_full.jsonl"
  validate_images: true
  ignore_missing: false
