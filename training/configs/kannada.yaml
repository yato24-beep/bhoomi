# Kannada Handwriting Recognition Fine-Tuning Configuration
experiment_name: kannada_handwriting_trocr
languages:
  - kannada

output_dir: models/trocr/kannada_checkpoints
batch_size: 4
eval_batch_size: 4
num_epochs: 5
learning_rate: 0.00005
weight_decay: 0.01
warmup_steps: 50
logging_steps: 10
eval_steps: 50
save_steps: 100
save_total_limit: 3
mixed_precision: "no"
device: "auto"
seed: 42

model:
  model_name_or_path: "microsoft/trocr-small-handwritten"
  model_version: "kannada_v1"
  max_sequence_length: 64
  image_size: [384, 384]
  freeze_encoder: false

augmentation:
  enabled: true
  rotation_range_deg: 3.0
  contrast_range: [0.85, 1.15]
  brightness_range: [0.90, 1.10]
  noise_std: 0.02
  blur_kernel_prob: 0.10

dataset:
  train_manifest: "training/datasets/train_kannada.jsonl"
  val_manifest: "training/datasets/val_kannada.jsonl"
  test_manifest: "training/datasets/test_kannada.jsonl"
  validate_images: true
  ignore_missing: true
