# Targeted Fine-Tuning Configuration for Confusing Kannada Characters (ತಿ, ಲಿ, ಟಿ, ಡಿ, ರಿ)
experiment_name: kothi_targeted_finetune
languages:
  - kannada

output_dir: models/trocr/kothi_targeted_checkpoints
batch_size: 8
eval_batch_size: 8
num_epochs: 4
learning_rate: 0.000015
weight_decay: 0.01
warmup_steps: 10
logging_steps: 5
eval_steps: 25
save_steps: 25
save_total_limit: 2
mixed_precision: "fp16"
device: "cuda"
seed: 42

model:
  model_name_or_path: "models/trocr/kannada_full_checkpoints/best_checkpoint"
  tokenizer_name_or_path: "models/trocr/kannada_full_checkpoints/best_checkpoint"
  model_version: "kothi_targeted_v1"
  max_sequence_length: 32
  image_size: [384, 384]
  freeze_encoder: false

augmentation:
  enabled: true
  rotation_range_deg: 2.0
  contrast_range: [0.90, 1.10]
  brightness_range: [0.90, 1.10]
  noise_std: 0.01
  blur_kernel_prob: 0.05

dataset:
  train_manifest: "training/datasets/kothi_targeted/targeted_train.jsonl"
  val_manifest: "training/datasets/kothi_targeted/diagnostic_val.jsonl"
  test_manifest: "training/datasets/kothi_targeted/diagnostic_val.jsonl"
  validate_images: true
  ignore_missing: false
